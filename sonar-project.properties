# Read by the CI scanner (.github/workflows/_sonar.yaml).
sonar.projectKey=SNEAXIII_Mawster
sonar.organization=sneaxiii

# shadcn/ui is vendored and unmodified; Alembic revisions are generated.
sonar.exclusions=front/components/ui/**,api/migrations/versions/**

# en.ts and fr.ts mirror each other by design — that is what a locale file is.
sonar.cpd.exclusions=front/app/i18n/locales/**

# Cypress specs assert through helpers — champions-flags.cy.ts calls expectFlag(),
# which wraps .should('contain.text', ...). The "add at least one assertion" rule
# only scans the it() body, so it never sees them and flags every such test.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2699
sonar.issue.ignore.multicriteria.e1.resourceKey=front/cypress/**/*.cy.ts

# Kept in step with requires-python in api/pyproject.toml and target-version in
# ruff.toml. Left at 3.12, the analyser judges the backend against a syntax the
# code no longer targets.
sonar.python.version=3.14

# Backend coverage: the pytest job's `backend-coverage` artifact (_test.yaml, or
# sonar.yaml on main, where the CI pipeline never runs).
sonar.python.coverage.reportPaths=api/coverage.xml
sonar.rust.lcov.reportPaths=static-assets/lcov.info
sonar.javascript.lcov.reportPaths=front/coverage/lcov.info

# Only api/src (pytest, see [tool.coverage.run] in api/pyproject.toml),
# static-assets/src (cargo llvm-cov) and the front's pure logic (vitest, see
# coverage.include in front/vitest.config.mts) are measured.
# Every other file would be reported as 0% covered by Sonar's zero-coverage
# sensor and sink the new-code gate. They are still analysed for issues, just not
# counted in the coverage ratio.
sonar.coverage.exclusions=front/*.*,front/**/*.tsx,front/**/*.js,front/**/use-*.ts,front/**/_viewmodels/**,front/**/_hooks/**,front/hooks/**,front/cypress/**,front/tests/**,front/public/**,front/app/*.ts,front/app/_components/**,front/app/api/**,front/app/components/**,front/app/contexts/**,front/app/dev/**,front/app/i18n/**,front/app/types/**,front/app/ui/**,static-assets/museum/**,static-assets/src/main.rs,.claude/**,scripts/**,api/main.py,api/app_debugger.py,api/app_testing.py,api/**/__init__.py,api/tests/**,api/migrations/**,api/scripts/**,api/src/fixtures/**,api/src/utils/logging_config.py,api/src/controllers/dev_controller.py
