[package]
name = "mcoc-vision"
version = "1.25.0"
edition = "2024"
publish = false
description = "Rust Worker for Ia pipelines to detect champion on screen"

[dependencies]
anyhow = "1"
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
], optional = true }
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
] }
serde_json = { version = "1", features = ["preserve_order"] }
ultralytics-inference = { version = "0.0.55", default-features = false, features = ["annotate"] }
# Already pulled by ultralytics-inference's `annotate`, same features: no extra build.
imageproc = { version = "0.27", default-features = false, features = ["text"] }
ab_glyph = "0.2"
ndarray = "0.17.2"
clap = { version = "4.6.7", features = ["derive"] }
lapin = { version = "4.12.3", default-features = false, features = ["tokio"], optional = true }
futures-lite = { version = "2.0.0", optional = true }
serde = { version = "1", features = ["derive"] }
dotenvy = "0.15"
reqwest = { version = "0.13.5", default-features = false, optional = true }
rusty-s3 = { version = "0.11.0", optional = true }

[features]
worker = [
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:lapin",
    "dep:futures-lite",
    "dep:reqwest",
    "dep:rusty-s3",
]

[[bin]]
name = "worker"
required-features = ["worker"]

[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# A panic in a request path is a 500 nobody chose. Every remaining one has to
# be justified with an explicit #[allow] at the site, which is the point.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# --- deliberately off -------------------------------------------------------
# Documentation nitpicks: they demand a "# Errors" section on every function
# returning Result, which here means repeating the error enum in prose.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
# `user::UserError` reads better than `user::Error` at the call site.
module_name_repetitions = "allow"
# Comes entirely from transitive dependencies; nothing to act on here.
multiple_crate_versions = "allow"

[dev-dependencies]
rstest = "0.27.0"
tempfile = "3.27.0"
