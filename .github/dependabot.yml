version: 2
updates:
  # Dépendances Python : `pip` ne lit pas uv.lock et n'ouvrait aucun PR.
  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Un seul PR hebdo par projet, majors comprises.
    groups:
      api:
        patterns:
          - '*'

  # Dépendances Rust du serveur d'assets statiques
  - package-ecosystem: cargo
    directory: /static-assets
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      static-assets:
        patterns:
          - '*'

  # Dépendances Node.js (pnpm — même écosystème `npm` pour Dependabot)
  - package-ecosystem: npm
    directory: /front
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Ne couvre que les dépendances directes : les transitives ne bougent que
    # par ricochet ou sur alerte de sécurité.
    groups:
      front:
        patterns:
          - '*'

  # Images de base des Dockerfiles
  - package-ecosystem: docker
    directories:
      - /api
      - /front
      - /backup
      - /static-assets
    schedule:
      interval: monthly
    groups:
      docker:
        patterns:
          - '*'

  # Actions GitHub
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
