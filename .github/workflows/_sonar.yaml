name: Sonar scan

# Called by _test.yaml and sonar.yaml, never triggered. The caller's run must hold the
# `backend-coverage` (api/coverage.xml), `static-assets-coverage` and `front-coverage`
# (lcov.info) artifacts.
on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  sonar:
    name: SonarQube Cloud scan
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    # A Sonar outage must never fail `test`, which gates the images.
    continue-on-error: true
    # SONAR_TOKEN is an environment secret: without this line it resolves to an
    # empty string and the scanner fails with "Not authorized".
    environment: Api
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Sonar reads git blame to decide what counts as new code.
          fetch-depth: 0
      - name: Download backend coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: backend-coverage
          path: api
      - name: Download static-assets coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: static-assets-coverage
          path: static-assets
      - name: Download frontend coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: front-coverage
          path: front/coverage
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
