name: Sonar scan

# Called by _test.yaml and sonar.yaml, never triggered. The caller's run must hold a
# `backend-coverage` artifact (api/coverage.xml from pytest --cov).
on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  sonar:
    name: SonarQube Cloud scan
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    # A Sonar outage must never fail `test`, which gates the images.
    continue-on-error: true
    # SONAR_TOKEN is an environment secret: without this line it resolves to an
    # empty string and the scanner fails with "Not authorized".
    environment: Api
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Sonar reads git blame to decide what counts as new code.
          fetch-depth: 0
      - name: Download backend coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: backend-coverage
          path: api
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
