name: Sonar

# Kept out of the main CI pipeline on purpose: that workflow only runs on
# push to release/staging and PRs to main, so main itself would never be
# analyzed — and Sonar needs an analysis of the default branch as the
# reference point every PR is compared against.

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: SonarQube Cloud scan
    runs-on: ubuntu-latest
    # SONAR_TOKEN is an *environment* secret, not a repository one: without this
    # line `secrets.SONAR_TOKEN` resolves to an empty string and the scanner
    # fails with "Not authorized or project not found".
    environment: Api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history, not the default shallow clone: Sonar reads git blame
          # to date issues and decide what counts as new code.
          fetch-depth: 0
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
