name: Tier list — build & deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'tierlist/**'
      - '.github/workflows/tierlist-pages.yaml'
  pull_request:
    paths:
      - 'tierlist/**'
      - '.github/workflows/tierlist-pages.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tierlist-pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: tierlist

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tierlist/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Pages serves the site from https://<owner>.github.io/<repo>/.
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: tierlist/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
