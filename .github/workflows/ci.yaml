name: CI Pipeline

# The pipeline graph lives here and nowhere else: `needs:` cannot cross workflow
# files, so every dependency between stages has to be expressed at this level.
# The stages themselves are in the _-prefixed files, which are called, never
# triggered.
on:
  push:
    branches:
      - release
      - staging
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test
    permissions:
      contents: read
    # NOSONAR githubactions:S7637 - false positive: local file, nothing to pin.
    uses: $/.github/workflows/_test.yaml

  changes:
    permissions:
      contents: read
    if: github.ref_name == 'release' || github.ref_name == 'staging' || github.event_name == 'workflow_dispatch'
    name: Compute deploy metadata
    runs-on: ubuntu-latest
    needs: test
    outputs:
      moving_tag: ${{ steps.meta.outputs.moving_tag }}
      tag_prefix: ${{ steps.meta.outputs.tag_prefix }}
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}
      also_staging: ${{ github.event_name == 'push' && github.ref_name == 'release' }}
    steps:
      - name: Compute deploy metadata
        id: meta
        # Through env, not ${{ }} in run: a template is expanded into the script text,
        # so a hostile branch name would be executed rather than compared.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "release" ]; then
            echo "moving_tag=latest" >> "$GITHUB_OUTPUT"
            echo "tag_prefix=" >> "$GITHUB_OUTPUT"
          else
            echo "moving_tag=staging" >> "$GITHUB_OUTPUT"
            echo "tag_prefix=staging-" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history and tags: git describe needs both.
          fetch-depth: 0
      # Resolved once here, then passed to the five image jobs. Each of them used to call `date`
      # on its own, so a run straddling a minute produced images tagged inconsistently.
      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          if ! LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null); then
            echo "::error::no v* tag found - the first release has not been published yet."
            exit 1
          fi
          # Trees are compared, not commits: promoting main to release creates a merge commit, so
          # HEAD is never *on* the tag even when the content is identical.
          if git diff --quiet "$LAST_TAG" HEAD; then
            VERSION="${LAST_TAG#v}"
            RELEASED=true
          else
            VERSION="$(git describe --tags --match 'v*' | sed 's/^v//')"
            RELEASED=false
          fi
          {
            echo "version=$VERSION"
            echo "released=$RELEASED"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (released content: $RELEASED)"

  images:
    name: Images
    permissions:
      contents: read
    needs: changes
    # NOSONAR githubactions:S7637 - false positive: local file, nothing to pin.
    uses: $/.github/workflows/_images.yaml
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      moving_tag: ${{ needs.changes.outputs.moving_tag }}
      tag_prefix: ${{ needs.changes.outputs.tag_prefix }}
      version: ${{ needs.changes.outputs.version }}
      also_staging: ${{ needs.changes.outputs.also_staging }}

  deploy:
    name: Deploy
    permissions:
      contents: read
    needs: [changes, images]
    # NOSONAR githubactions:S7637 - false positive: local file, nothing to pin.
    uses: $/.github/workflows/_deploy.yaml
    secrets:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    with:
      version: ${{ needs.changes.outputs.version }}
      released: ${{ needs.changes.outputs.released }}
