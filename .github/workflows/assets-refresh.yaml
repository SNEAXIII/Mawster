name: Champion assets refresh

on:
  workflow_dispatch:

jobs:
  refresh:
    name: Scrape the wiki and open a PR
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.BOT_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ vars.PYTHON_VERSION }}
          enable-cache: true

      - name: Scrape champions from the wiki
        working-directory: ./static-assets/museum/scrap
        # --no-build: nothing here needs building, and it blocks dependency
        # setup scripts.
        run: uv run --locked --no-build python scrape_champions.py

      # Fixed branch, not a dated one: successive runs amend one PR instead of
      # piling up one per run.
      - name: Open or update the assets PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.BOT_TOKEN }}
          branch: bot/assets-refresh
          base: main
          commit-message: 'chore(assets): refresh champions from the wiki'
          title: 'chore(assets): refresh champions from the wiki'
          labels: assets-bot
          body: |
            Automated scrape of the champion wiki.

            The vision gate posts a naming-regression report on this PR once it
            finishes. It is informational and never blocks the merge.

            Merging lands the assets on `main`, but production does not gain the
            champion until this is promoted to `release`, which rebuilds and
            pushes the api and static images - only then does `make deploy`
            (which runs `seed-champions`) pick it up.
