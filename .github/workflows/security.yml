name: Security Scan

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]

jobs:
  trivy:
    name: Trivy Security Scan
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

  zizmor:
    name: GitHub Actions audit
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # One-shot run: a cache would buy nothing and trips zizmor's own
          # cache-poisoning audit.
          enable-cache: false
      # Fails the build. The pre-commit hook runs the same command, but only for
      # contributors who installed it and did not pass --no-verify.
      - name: Audit workflows
        run: uvx --no-build zizmor@1.29.0 --config .github/zizmor.yml --min-severity low .github/workflows/
