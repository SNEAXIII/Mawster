name: Test

# Called by ci-cd.yaml, never triggered on its own.
on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true
      BOT_TOKEN:
        required: true

env:
  NODE_VERSION: '24'
  E2E_RUNNERS: '10'
  # Read by the planner and by the runner command below: specs are balanced
  # across E2E_RUNNERS * E2E_WORKERS lanes, so the two must stay in step.
  E2E_WORKERS: '2'

jobs:
  lint-test-python:
    name: Lint & Test for backend
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      MODE: testing
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ vars.PYTHON_VERSION }}
          enable-cache: true
      - name: Install backend dependencies
        # --no-build blocks source-dist build scripts, where a compromised
        # dependency would run code; it also refuses this project, hence
        # --no-install-project — pytest puts ./api on sys.path anyway.
        run: uv sync --all-groups --locked --no-build --no-install-project
      - name: Run Ruff linter
        run: uvx --no-build ruff@0.16.0 check .
      - name: Run Ruff formatter check
        run: uvx --no-build ruff@0.16.0 format --check .
      - name: Run backend unit tests
        # Kept apart: importing main under MODE=testing fakes DiscordAuthService.verify_token.
        run: uv run --no-sync --no-build pytest tests/unit -v --tb=short -n auto --cov
      - name: Run backend integration tests
        # `auto` is the runner's 4 vCPUs. Oversubscribing does not pay: 6 workers measured
        run: uv run --no-sync --no-build pytest tests/integration -v --tb=short -n auto --cov --cov-append --cov-report=xml:coverage.xml
      - name: Upload backend coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-coverage
          path: api/coverage.xml
          retention-days: 1
          if-no-files-found: error

  sonar:
    name: Sonar
    permissions:
      contents: read
      pull-requests: read
    needs: [lint-test-python, lint-test-static-assets, lint-test-front]
    if: github.event_name == 'pull_request' || github.ref_name == 'release'
    uses: $/.github/workflows/_sonar.yaml # NOSONAR githubactions:S7637 - false positive: local file, nothing to pin.
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  lint-test-front:
    name: Lint, typecheck & test for frontend
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: corepack enable
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: front/node_modules
          # Deliberately not the `node-modules-` key the E2E jobs use: theirs also carries
          # Cypress, and a cache this job populated without it would give them a hit and
          # skip their `cypress install`.
          key: node-modules-lint-${{ runner.os }}-${{ hashFiles('front/pnpm-lock.yaml') }}
      - name: Install frontend dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ./front
        # Neither oxlint nor oxlint-tsgolint has an install script — their binaries ship as
        # per-platform optional dependencies — so --ignore-scripts costs nothing here.
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run oxlint
        working-directory: ./front
        # --type-aware needs oxlint-tsgolint, which package.json carries. Warnings do not
        # fail the build yet: the sonarjs recommended set is new here and still has a
        # backlog. Add --deny-warnings once it is down to zero.
        run: pnpm exec oxlint --type-aware
      - name: Check frontend formatting
        working-directory: ./front
        run: pnpm format:check
      - name: Typecheck frontend
        working-directory: ./front
        run: pnpm exec tsc --noEmit
      # Own TS project: the app tsconfig and oxlint both exclude cypress/.
      - name: Typecheck Cypress specs
        working-directory: ./front
        run: pnpm exec tsc -p cypress/tsconfig.json --noEmit
      - name: Run frontend unit tests with coverage
        working-directory: ./front
        run: pnpm test:coverage
      - name: Upload frontend coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: front-coverage
          path: front/coverage/lcov.info
          retention-days: 1
          if-no-files-found: error

  lint-test-static-assets:
    name: Lint & Test for static-assets
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./static-assets
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Cache cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            static-assets/target
          key: cargo-${{ runner.os }}-${{ hashFiles('static-assets/Cargo.lock') }}
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-llvm-cov
      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview
      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features
      - name: Run static-assets tests with coverage
        run: cargo llvm-cov --locked --all-features --lcov --output-path lcov.info
      - name: Upload static-assets coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: static-assets-coverage
          path: static-assets/lcov.info
          retention-days: 1
          if-no-files-found: error

  lint-test-vision:
    name: Lint & Test for vision worker
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rust-vision
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Cache cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-vision/target
          key: cargo-vision-lint-${{ runner.os }}-${{ hashFiles('rust-vision/Cargo.lock') }}
      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features
      - name: Run vision tests
        run: cargo test --locked --all-features

  e2e-build-vision:
    name: E2E — Build vision worker
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rust-vision
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Resolve the private submodule commit
        id: private
        run: echo "sha=$(git rev-parse HEAD:rust-vision/artifacts-vision)" >> "$GITHUB_OUTPUT"
      - name: Checkout the private models and screenshots
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SNEAXIII/artifacts-vision
          ref: ${{ steps.private.outputs.sha }}
          path: rust-vision/artifacts-vision
          token: ${{ secrets.BOT_TOKEN }}
          persist-credentials: false
      - name: Cache cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-vision/target
          key: cargo-vision-release-${{ runner.os }}-${{ hashFiles('rust-vision/Cargo.lock') }}
      - name: Build the worker, the gallery builder and the GT runner
        run: cargo build --release --locked --features worker --bins
      - name: Build the gallery
        run: ./target/release/build_gallery --portraits ../static-assets/static/champions --champions ../api/src/fixtures/champions.json --output artifacts/gallery/mosaic.bin
      - name: Run the ground truth
        run: ./target/release/mcoc-vision --no-save
      # Models stay out: artifacts of a public repo are public.
      - name: Archive the worker and its gallery
        run: tar -czf /tmp/vision-worker.tar.gz -C target/release worker -C ../../artifacts/gallery mosaic.bin
      - name: Upload the vision worker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vision-worker
          path: /tmp/vision-worker.tar.gz
          retention-days: 1
          if-no-files-found: error

  e2e-plan:
    name: E2E — Plan spec distribution
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Compute spec distribution
        id: plan
        run: echo "matrix=$(python3 scripts/e2e/spec_planner.py --runners ${{ env.E2E_RUNNERS }} --workers ${{ env.E2E_WORKERS }})" >> $GITHUB_OUTPUT

  e2e-build:
    name: E2E — Build frontend
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: corepack enable
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            front/node_modules
            ~/.cache/Cypress
          key: node-modules-${{ runner.os }}-${{ hashFiles('front/pnpm-lock.yaml') }}
      - name: Install frontend dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ./front
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec cypress install
      - name: Build frontend (next build)
        working-directory: ./front
        env:
          NEXT_PUBLIC_DEV_MODE: 'true'
          NEXT_DIST_DIR: .next-e2e
          NEXT_E2E_BUILD: 'true'
          API_PORT: '8000'
          API_SERVER_HOST: localhost
          STATIC_SERVER_HOST: 127.0.0.1 # rewrites are baked at build; scripts/e2e/servers.py serves static-assets there
          STATIC_PORT: '8009'
        run: pnpm build
      - name: Archive frontend build
        run: tar -czf /tmp/next-e2e-build.tar.gz -C front .next-e2e
      - name: Upload frontend build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: next-e2e-build
          path: /tmp/next-e2e-build.tar.gz
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: E2E Tests (runner ${{ matrix.runner }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [e2e-plan, e2e-build, e2e-build-vision, lint-test-python, lint-test-front, lint-test-static-assets, lint-test-vision]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.e2e-plan.outputs.matrix) }}
    env:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=und
      # Same digest as compose-dev and the stacks.
      POSTGRES_IMAGE: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    # Not under `services:`, whose pull every matrix job pays before its first step: pulled in the
    # background instead, while each backend waits for the server itself (api/app_testing.py).
    steps:
      - name: Start PostgreSQL in the background
        run: |
          nohup docker run -d --name postgres-test -p 5433:5432 \
            -e "POSTGRES_USER=$POSTGRES_USER" \
            -e "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" \
            -e "POSTGRES_INITDB_ARGS=$POSTGRES_INITDB_ARGS" \
            "$POSTGRES_IMAGE" >/dev/null 2>&1 &

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ vars.PYTHON_VERSION }}
          enable-cache: true
      - name: Install API dependencies
        working-directory: ./api
        # Same flags as the lint job above.
        run: uv sync --all-groups --locked --no-build --no-install-project
      # They wait for PostgreSQL and migrate while the frontend is set up below.
      - name: Start backends in the background
        run: python3 scripts/e2e/e2e_parallel.py backends --spec "${{ matrix.specs }}"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: corepack enable
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            front/node_modules
            ~/.cache/Cypress
          key: node-modules-${{ runner.os }}-${{ hashFiles('front/pnpm-lock.yaml') }}
      - name: Install frontend dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ./front
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec cypress install
      # The cache never holds a verified binary, so each `cypress run` would smoke-test it at
      # launch; verifying once here, behind the remaining steps, writes the flag both workers read.
      - name: Verify Cypress in the background
        working-directory: ./front
        run: nohup pnpm exec cypress verify >/dev/null 2>&1 &
      - name: Download frontend build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: next-e2e-build
          path: /tmp
      - name: Extract frontend build
        run: tar -xzf /tmp/next-e2e-build.tar.gz -C front

      - name: Run Cypress E2E tests (runner ${{ matrix.runner }})
        run: python3 scripts/e2e/e2e_parallel.py tests --spec "${{ matrix.specs }}"
      - name: Upload Cypress results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cypress-results-runner-${{ matrix.runner }}
          path: front/cypress/results

  e2e-vision:
    name: E2E Tests (vision)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [e2e-plan, e2e-build, e2e-build-vision, lint-test-python, lint-test-front, lint-test-static-assets, lint-test-vision]
    env:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=und
      # Same digest as compose-dev and the stacks.
      POSTGRES_IMAGE: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    steps:
      - name: Start PostgreSQL, RabbitMQ and RustFS in the background
        run: |
          nohup docker run -d --name postgres-test -p 5433:5432 \
            -e "POSTGRES_USER=$POSTGRES_USER" \
            -e "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" \
            -e "POSTGRES_INITDB_ARGS=$POSTGRES_INITDB_ARGS" \
            "$POSTGRES_IMAGE" >/dev/null 2>&1 &
          nohup docker run -d --name rabbitmq-test -p 5672:5672 \
            -e RABBITMQ_DEFAULT_USER=mawster -e RABBITMQ_DEFAULT_PASS=mawster \
            rabbitmq:3.13-management >/dev/null 2>&1 &
          nohup docker run -d --name rustfs-test -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=mawster -e RUSTFS_SECRET_KEY=mawsterpassword \
            rustfs/rustfs:latest >/dev/null 2>&1 &
          nohup docker pull amazon/aws-cli:latest >/dev/null 2>&1 &

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Resolve the private submodule commit
        id: private
        run: echo "sha=$(git rev-parse HEAD:rust-vision/artifacts-vision)" >> "$GITHUB_OUTPUT"
      - name: Checkout the private models
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SNEAXIII/artifacts-vision
          ref: ${{ steps.private.outputs.sha }}
          path: rust-vision/artifacts-vision
          token: ${{ secrets.BOT_TOKEN }}
          persist-credentials: false
      - name: Download the vision worker
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vision-worker
          path: /tmp
      - name: Extract the vision worker
        run: mkdir -p /tmp/vision-worker && tar -xzf /tmp/vision-worker.tar.gz -C /tmp/vision-worker
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ vars.PYTHON_VERSION }}
          enable-cache: true
      - name: Install API dependencies
        working-directory: ./api
        run: uv sync --all-groups --locked --no-build --no-install-project
      - name: Find the vision specs
        id: specs
        working-directory: ./front
        run: echo "list=$(find cypress/e2e -name '*vision*.cy.ts' | sort | paste -sd, -)" >> "$GITHUB_OUTPUT"
      # Waits for RabbitMQ, RustFS and the backend's queues, then starts the worker.
      - name: Start the backend and the vision worker in the background
        env:
          SPECS: ${{ steps.specs.outputs.list }}
        run: |
          python3 scripts/e2e/e2e_parallel.py backends --vision \
            --worker-bin /tmp/vision-worker/worker --gallery /tmp/vision-worker/mosaic.bin \
            --spec "$SPECS"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: corepack enable
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            front/node_modules
            ~/.cache/Cypress
          key: node-modules-${{ runner.os }}-${{ hashFiles('front/pnpm-lock.yaml') }}
      - name: Install frontend dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ./front
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec cypress install
      - name: Download frontend build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: next-e2e-build
          path: /tmp
      - name: Extract frontend build
        run: tar -xzf /tmp/next-e2e-build.tar.gz -C front

      - name: Run Cypress vision E2E tests
        env:
          SPECS: ${{ steps.specs.outputs.list }}
        run: python3 scripts/e2e/e2e_parallel.py tests --vision --spec "$SPECS"
      - name: Upload Cypress results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cypress-results-vision
          path: front/cypress/results
