name: Test

# Called by ci.yaml, never triggered on its own.
#
# Lint and E2E stay in the same file on purpose: `needs:` cannot cross workflow
# files, and the eight E2E runners gate on the two lint jobs so a failing lint
# does not burn them. Split into two called workflows, that gate would have to
# become a dependency between the workflows themselves, and the plan and build
# jobs — which depend on no lint at all — would start a minute later for nothing.
on:
  workflow_call:

# Workflow-level env is not inherited from the caller, so it is restated here.
env:
  WORKDIR: ./api
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION }}
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  E2E_RUNNERS: '8'

jobs:
  lint-test-python:
    name: Lint & Test for backend
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      MODE: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install dev dependencies
        working-directory: ${{ env.WORKDIR }}
        # --no-build blocks source-dist build scripts, where a compromised
        # dependency would run code; it also refuses this project, hence
        # --no-install-project — pytest puts ./api on sys.path anyway.
        run: uv sync --all-groups --locked --no-build --no-install-project
      - name: Run Ruff linter
        working-directory: ${{ env.WORKDIR }}
        run: uvx --no-build ruff@0.16.0 check .
      - name: Run Ruff formatter check
        working-directory: ${{ env.WORKDIR }}
        run: uvx --no-build ruff@0.16.0 format --check .
      - name: Run unit tests
        working-directory: ${{ env.WORKDIR }}
        run: uv run --no-sync pytest tests/unit -v --tb=short
      - name: Run integration tests
        working-directory: ${{ env.WORKDIR }}
        run: uv run --no-sync pytest tests/integration -v --tb=short -n auto

  lint-front:
    name: Lint & typecheck for frontend
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: front/node_modules
          # Deliberately not the `node-modules-` key the E2E jobs use: theirs also carries
          # Cypress, and a cache this job populated without it would give them a hit and
          # skip their `cypress install`.
          key: node-modules-lint-${{ runner.os }}-${{ hashFiles('front/package-lock.json') }}
      - name: Install frontend dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ./front
        # Neither oxlint nor oxlint-tsgolint has an install script — their binaries ship as
        # per-platform optional dependencies — so --ignore-scripts costs nothing here.
        run: npm ci --ignore-scripts
      - name: Run oxlint
        working-directory: ./front
        # --type-aware needs oxlint-tsgolint, which package.json carries. Warnings do not
        # fail the build yet: the sonarjs recommended set is new here and still has a
        # backlog. Add --deny-warnings once it is down to zero.
        run: npx --no-install oxlint --type-aware
      - name: Check formatting
        working-directory: ./front
        run: npx --no-install prettier --check .
      - name: Typecheck
        working-directory: ./front
        run: npx --no-install tsc --noEmit

  e2e-plan:
    name: E2E — Plan spec distribution
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Compute spec distribution
        id: plan
        run: echo "matrix=$(python3 scripts/spec_planner.py --runners ${{ env.E2E_RUNNERS }})" >> $GITHUB_OUTPUT

  e2e-build:
    name: E2E — Build frontend
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            front/node_modules
            ~/.cache/Cypress
          key: node-modules-${{ runner.os }}-${{ hashFiles('front/package-lock.json') }}
      - name: Install frontend dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ./front
        run: |
          npm ci --ignore-scripts
          npx --no-install cypress install
      - name: Build frontend (next build)
        working-directory: ./front
        env:
          NEXT_PUBLIC_DEV_MODE: 'true'
          NEXT_DIST_DIR: .next-e2e
          NEXT_E2E_BUILD: 'true'
          API_PORT: '8000'
          API_SERVER_HOST: localhost
        run: npm run build
      - name: Archive frontend build
        run: tar -czf /tmp/next-e2e-build.tar.gz -C front .next-e2e
      - name: Upload frontend build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: next-e2e-build
          path: /tmp/next-e2e-build.tar.gz
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: E2E Tests (runner ${{ matrix.runner }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [e2e-plan, e2e-build, lint-test-python, lint-front]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.e2e-plan.outputs.matrix) }}
    env:
      MARIADB_USER: user
      MARIADB_PASSWORD: password
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: mawster-testing
    services:
      mariadb-test:
        image: mariadb
        env:
          MARIADB_USER: user
          MARIADB_PASSWORD: password
          MARIADB_ROOT_PASSWORD: rootpassword
          MARIADB_DATABASE: mawster-testing
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install API dependencies
        working-directory: ./api
        # Same flags as the lint job above.
        run: uv sync --all-groups --locked --no-build --no-install-project
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            front/node_modules
            ~/.cache/Cypress
          key: node-modules-${{ runner.os }}-${{ hashFiles('front/package-lock.json') }}
      - name: Install frontend dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ./front
        run: |
          npm ci --ignore-scripts
          npx --no-install cypress install
      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: next-e2e-build
          path: /tmp
      - name: Extract frontend build
        run: tar -xzf /tmp/next-e2e-build.tar.gz -C front

      - name: Run Cypress E2E tests (runner ${{ matrix.runner }})
        run: python3 scripts/e2e_parallel.py --workers 2 --spec "${{ matrix.specs }}" --skip-build --quiet
      - name: Upload Cypress results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cypress-results-runner-${{ matrix.runner }}
          path: front/cypress/results
