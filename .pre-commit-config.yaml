repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Front tools run from front/node_modules, never a pinned mirror: hook and npm script can't disagree.
  - repo: local
    hooks:
      # PT012 counts statements, not throwing calls: `_init(s, [_declaration(...)])` slips past it.
      - id: raises-arity
        name: one throwing call per pytest.raises
        # uv, not python3: Windows has no python3.
        entry: uv run --no-project python scripts/check_raises_arity.py
        language: system
        files: ^api/tests/.*\.py$

      - id: sync-coverage-exclusions
        name: sync coverage exclusions (pyproject ↔ sonar)
        entry: uv run --no-project python scripts/sync_python_exclusions.py
        language: system
        pass_filenames: false
        files: ^(api/pyproject\.toml|sonar-project\.properties|scripts/sync_python_exclusions\.py)$

      # Accepted findings live in .github/zizmor.yml.
      - id: zizmor
        name: GitHub Actions audit
        entry: uvx --no-build zizmor --config .github/zizmor.yml --min-severity low .github/workflows/
        language: system
        pass_filenames: false
        files: ^\.github/(workflows/.*|zizmor\.yml)$

      # Runs from front/ (where .oxlintrc.json and tsconfig.json live), hence the stripped prefix.
      # Unmatched patterns are fine: a cypress-only commit hands over paths .oxlintrc.json ignores.
      - id: oxlint
        name: oxlint (front)
        entry: 'bash -c ''cd front && exec node_modules/.bin/oxlint --type-aware --fix --no-error-on-unmatched-pattern "${@#front/}"'' --'
        language: system
        files: ^front/.*\.(ts|tsx|js|jsx|mjs|cjs)$

      # Own TS project: the app tsconfig and oxlint both exclude cypress/.
      - id: tsc-cypress
        name: typecheck (cypress)
        entry: bash -c 'cd front && exec node node_modules/typescript/bin/tsc -p cypress/tsconfig.json --noEmit'
        language: system
        pass_filenames: false
        files: ^front/cypress/.*\.ts$

      # After oxlint --fix so formatting has the last word. Through node: Windows can't run the
      # node_modules/.bin `#!/bin/sh` wrapper.
      - id: prettier
        name: prettier (front)
        entry: node front/node_modules/prettier/bin/prettier.cjs --write --ignore-path front/.prettierignore
        language: system
        files: ^front/.*\.(ts|tsx|js|jsx|mjs|cjs|css|json|md)$

      - id: cargo-fmt
        name: rustfmt (static-assets)
        entry: cargo fmt --manifest-path static-assets/Cargo.toml
        language: system
        pass_filenames: false
        files: ^static-assets/src/.*\.rs$

      # CI runs no cargo step: this is the only Rust lint gate.
      - id: cargo-clippy
        name: clippy (static-assets)
        entry: cargo clippy --manifest-path static-assets/Cargo.toml --all-targets --all-features
        language: system
        pass_filenames: false
        files: ^static-assets/(src/.*\.rs|Cargo\.(toml|lock))$
