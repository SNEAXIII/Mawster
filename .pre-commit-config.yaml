repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Both run from the project's own node_modules rather than a pinned mirror, so a hook and its
  # npm script counterpart can never disagree on the same file.
  #
  # oxlint --fix runs before prettier so that formatting has the last word. It has to `cd front`
  # first: oxlint resolves .oxlintrc.json and tsconfig.json from the working directory, and the
  # repo root has neither — hence the prefix stripping on the staged paths pre-commit hands over.
  #
  # prettier is invoked through `node` on its real entry point rather than node_modules/.bin/prettier:
  # that wrapper is a `#!/bin/sh` script, and a pre-commit running under a native Windows Python
  # cannot resolve that shebang ("Executable /bin/sh not found"). Going through node works the same
  # on Windows and in CI.
  - repo: local
    hooks:
      # Ruff's PT012 rejects a `pytest.raises` block holding several statements, but it
      # does not look inside the statement — `_init(s, [_declaration(...)])` is one
      - id: raises-arity
        name: one throwing call per pytest.raises
        # uv run, not python3: no python3 on Windows. --no-project skips resolving api/.
        entry: uv run --no-project python scripts/check_raises_arity.py
        language: system
        files: ^api/tests/.*\.py$

      # Accepted trade-offs are listed in .github/zizmor.yml so a new finding stands out.
      # --min-severity low: informational findings should not block a commit.
      - id: zizmor
        name: GitHub Actions audit
        entry: uvx --no-build zizmor --config .github/zizmor.yml --min-severity low .github/workflows/
        language: system
        pass_filenames: false
        files: ^\.github/(workflows/.*|zizmor\.yml)$

      - id: oxlint
        name: oxlint (front)
        # --type-aware pulls in the rules that need a TS program (prefer-nullish-coalescing and
        # friends); it needs oxlint-tsgolint, which package.json carries.
        entry: "bash -c 'cd front && exec node_modules/.bin/oxlint --type-aware --fix \"${@#front/}\"' --"
        language: system
        # cypress/ is in .oxlintrc.json's ignorePatterns, so handing those paths over makes
        # oxlint exit 1 on "No files found to lint" — a commit touching only specs would fail.
        files: ^front/.*\.(ts|tsx|js|jsx|mjs|cjs)$
        exclude: ^front/(node_modules|\.next|cypress)/

      - id: prettier
        name: prettier (front)
        entry: node front/node_modules/prettier/bin/prettier.cjs --write --ignore-path front/.prettierignore
        language: system
        files: ^front/.*\.(ts|tsx|js|jsx|mjs|cjs|css|json|md)$
        exclude: ^front/(node_modules|\.next)/
