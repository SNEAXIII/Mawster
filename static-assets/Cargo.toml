[package]
name = "mawster-static-files"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust Web server for static asset, ngninx like"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "tokio",
    "tracing",
], optional = true }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
tower-http = { version = "0.7.1", features = ["fs", "set-header"], optional = true }
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "webp",
], optional = true }
rayon = { version = "1.12.0", optional = true }
indicatif = { version = "0.18.6", features = ["rayon"], optional = true }

[features]
server = ["dep:axum", "dep:tokio", "dep:tracing", "dep:tracing-subscriber", "dep:tower-http"]
assets = ["dep:image", "dep:rayon", "dep:indicatif"]

[[bin]]
name = "mawster-static-files"
path = "src/main.rs"
required-features = ["server"]

[[bin]]
name = "build_assets"
required-features = ["assets"]

[profile.dev.package.image]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# A panic in a request path is a 500 nobody chose. Every remaining one has to
# be justified with an explicit #[allow] at the site, which is the point.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# --- deliberately off -------------------------------------------------------
# Documentation nitpicks: they demand a "# Errors" section on every function
# returning Result, which here means repeating the error enum in prose.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
# `user::UserError` reads better than `user::Error` at the call site.
module_name_repetitions = "allow"
# Comes entirely from transitive dependencies; nothing to act on here.
multiple_crate_versions = "allow"

[dev-dependencies]
rstest = "0.27.0"
