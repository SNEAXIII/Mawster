[package]
name = "mawster-static-files"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust Web server for static asset, ngninx like"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "tracing"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }

[profile.dev.package."*"]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# A panic in a request path is a 500 nobody chose. Every remaining one has to
# be justified with an explicit #[allow] at the site, which is the point.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# --- deliberately off -------------------------------------------------------
# Documentation nitpicks: they demand a "# Errors" section on every function
# returning Result, which here means repeating the error enum in prose.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
# `user::UserError` reads better than `user::Error` at the call site.
module_name_repetitions = "allow"
# Comes entirely from transitive dependencies; nothing to act on here.
multiple_crate_versions = "allow"
